[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddlake-ingestion"
version = "0.1.0"
description = "Ingestion jobs for the Global & Dutch Digital Divide Lakehouse"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "azure-identity>=1.15",
    "azure-storage-file-datalake>=12.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.setuptools.package-data]
ingestion = ["config/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
